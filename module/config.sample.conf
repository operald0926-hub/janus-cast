# /data/adb/extdisplay/config.conf
# 修改后执行: su -c '/data/adb/modules/extdisplay/bin/extd stop; su -c ... start'
# 或直接重启。删掉本文件即回到全部默认值。

# 横屏锁定方向：1 = 逆时针 90°（多数场景），3 = 顺时针 90°
LANDSCAPE_ROT=1

# 密度策略
#   external = 用外屏自身报告的 density（默认，最贴近"按电视来"），
#              并裁剪到 [DENSITY_MIN, DENSITY_MAX]
#   ratio    = 让外屏的逻辑 dp 高度与原内屏一致
#   fixed    = 固定用 FIXED_DENSITY
DENSITY_MODE=external
FIXED_DENSITY=320
DENSITY_MIN=160
DENSITY_MAX=480

# 轮询间隔（秒）。越小响应越快，功耗越高。
POLL_INTERVAL=2

# 外屏连续消失多少次才判定为断开（防抖，避免切模式时误触发还原）
MISS_DEBOUNCE=2

# 1 = 不看 layerStack，任何非内屏都跟随。仅调试用，可能导致扩展桌面被误改。
ACCEPT_ANY_EXTERNAL=0

# 直接认定为「镜像」的显示类型，逗号分隔。命中即跟随，不再看 layerStack。
# 为什么需要：实测 ColorOS 16 + BRAVIA 无线投屏时，虚拟显示拿到的是独立
# layerStack（实测 =3），但 SurfaceFlinger 里图层是 "mirrored from" 内屏，
# 确实是镜像。所以 layerStack 相等不能作为唯一判据。
# 留空则退回「只认同 layerStack」的旧行为。
MIRROR_TYPES=WIFI

# 像素上限，超过直接拒绝应用，防止单帧缓冲过大把栈打崩。
# 默认 3686400 = 2560x1440。要用 4K 外屏就改成 8294400。
MAX_PIXELS=3686400

LOG_MAX_KB=512

# 投屏期间是否把默认桌面换成支持横屏的桌面。
# 为什么需要：ColorOS 桌面是竖屏锁定 + 不可缩放，横屏下会被 letterbox 成屏幕正中
# 一条 608x1080 的竖条（实测 mBounds=Rect(656,0-1264,1080)），任何 wm 旋钮都改不动。
# 换成支持横屏的桌面后，桌面窗口直接是 Rect(0,0-1920,1080)，铺满全屏。
# 断开投屏时自动换回原桌面（原桌面记在基线里，不写死）。
SWITCH_LAUNCHER=1
LANDSCAPE_LAUNCHER=app.lawnchair/app.lawnchair.LawnchairLauncher
